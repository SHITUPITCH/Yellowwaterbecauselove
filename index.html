<title>Professsor Wong</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --sub:#3a3a3c;
    --faint:#b3b3b8;
    --line:#ececec;
    --card:#fbfbfb;
    --accent:#DFFF00;
    --accent-dark:#8fa300;
    --cathead:#DFFF00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  #bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;
    background-repeat:no-repeat;pointer-events:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;padding:0 0 60px;}

  header.top{position:sticky;top:0;background:var(--card);backdrop-filter:blur(8px);
    z-index:10;padding:18px 20px 10px;border-bottom:1px solid var(--line);}
  .title{font-size:20px;font-weight:600;letter-spacing:.2px;margin:0 0 12px;cursor:pointer;min-height:26px;display:block;}
  .title:active{opacity:.6;}
  .title-row{display:flex;align-items:center;justify-content:space-between;}
  .settings-btn{width:32px;height:32px;margin-bottom:12px;border:none;border-radius:50%;
    background:#f2f2f4;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .settings-btn:active{background:#e6e6e8;}
  .tabs{display:flex;background:#f2f2f4;border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:14px;border-radius:8px;color:var(--sub);
    cursor:pointer;font-weight:500;transition:.15s;}
  .tab.active{background:#ffffff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 0 2px;}
  .navbtn{width:30px;height:30px;border-radius:50%;border:none;background:#f2f2f4;color:var(--text);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .navbtn:active{background:#e6e6e8;}
  .navlabel{font-size:15px;font-weight:600;min-width:110px;text-align:center;}

  main{padding:14px 16px 0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--cathead);}
  .cat-name{font-size:15.5px;font-weight:600;color:var(--text);cursor:pointer;min-width:60px;min-height:20px;display:inline-block;}
  .cat-name:active{opacity:.6;}
  .yr-cat-name{cursor:pointer;min-width:60px;min-height:18px;display:inline-block;}
  .yr-cat-name:active{opacity:.6;}
  .name-placeholder{color:var(--faint);font-weight:500;font-style:italic;}
  .cat-head .name-placeholder{color:rgba(0,0,0,.4);}
  .cat-right{display:flex;align-items:center;gap:8px;}
  .cat-count{font-size:13px;color:rgba(0,0,0,.45);font-variant-numeric:tabular-nums;}
  .chev{font-size:11px;color:rgba(0,0,0,.4);transition:transform .2s;}
  .card.open .chev{transform:rotate(90deg);}
  .drag-handle{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    color:var(--faint);cursor:grab;touch-action:none;user-select:none;flex:0 0 auto;}
  .cat-head .drag-handle{color:rgba(0,0,0,.4);}
  .dragging{opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.18);z-index:50;}
  .dragging .drag-handle{color:var(--text);cursor:grabbing;}
  .drop-placeholder{border:1.5px dashed #d5d5d8;border-radius:14px;margin-bottom:10px;background:#f7f7f8;}

  .cat-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .card.open .cat-body{max-height:1200px;}
  .cat-inner{padding:0 16px 14px;}

  .item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--cathead);}
  .item-row:first-child{border-top:none;}
  .check{width:20px;height:20px;border-radius:6px;border:1.6px solid #d5d5d8;flex:0 0 20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;}
  .check.done{background:var(--accent);border-color:var(--accent);}
  .check svg{width:12px;height:12px;display:none;}
  .check.done svg{display:block;}
  .item-name{flex:1;font-size:14.5px;color:var(--sub);cursor:pointer;}
  .item-name.done{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint);}
  .del{color:var(--faint);font-size:15px;cursor:pointer;padding:2px 4px;flex:0 0 auto;}

  .counter-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--cathead);}
  .counter-row:first-child{border-top:none;}
  .finance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
    border-top:1px solid var(--cathead);cursor:pointer;}
  .finance-row:first-child{border-top:none;}
  .finance-row-text{display:flex;flex-direction:column;gap:2px;}
  .finance-row-preview{font-size:12px;color:var(--faint);}

<script>
const CATEGORIES = [
  {id:'work', name:'工作'},
  {id:'sh', name:'SH 研究'},
  {id:'sport', name:'運動', recurringCount:{key:'晨跑', target:16}},
  {id:'finance', name:'理財管理', financeLink:{name:'月底理財管理'}},
  {id:'social', name:'娛樂'},
  {id:'shopping', name:'購買清單', defaultItems:[]},
  {id:'japanese', name:'日語'},
  {id:'books', name:'書籍'},
  {id:'todo', name:'代辦事項'},
  {id:'other', name:'其他'},
];

const FINANCE_DEFAULT = {
  debts: {
    A1:{name:'A1', total:0}, A2:{name:'A2', total:0}, A3:{name:'A3', total:0},
    A4:{name:'A4', total:0}, A5:{name:'A5', total:0}
  },
  months: {}
};

let data = {items:[], recurringChecks:{}, recurringCounts:{}, yearGoals:{}, categoryOrder:[], categoryNames:{}, theme:{bg:'#ffffff', accent:'#DFFF00', headerColor:'#DFFF00', bgImage:null}, appTitle:null, finance:null};
let draftTheme = null;
let view = 'month';
let curMonth = monthKeyFromDate(new Date());
let openState = {};

function pad(n){return n<10?'0'+n:''+n;}
function monthKeyFromDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function shiftMonthKey(key,delta){
  let [y,m]=key.split('-').map(Number);
  m+=delta;
  y+=Math.floor((m-1)/12);
  m=((m-1)%12+12)%12+1;
  return y+'-'+pad(m);
}
function shiftYearKey(key,delta){
  let [y,m]=key.split('-');
  y=parseInt(y)+delta;
  return y+'-'+m;
}
function monthLabel(key){
  let [y,m]=key.split('-');
  return y+'年'+parseInt(m)+'月';
}
function yearOf(key){return key.split('-')[0];}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

const LOCAL_KEY = 'life-tracker-app-data-v2';
const hasCloudStorage = typeof window.storage !== 'undefined';

async function load(){
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('app-data-v2', false);
      if(res && res.value){ data = JSON.parse(res.value); }
    }else{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw){ data = JSON.parse(raw); }
    }
  }catch(e){ /* no data yet */ }
  ensureDefaults();
  applyTheme(data.theme);
  render();
}
function ensureDefaults(){
  if(!data.yearGoals) data.yearGoals = {};
  if(!data.categoryNames) data.categoryNames = {};
  CATEGORIES.forEach(c=>{ if(!(c.id in data.categoryNames)) data.categoryNames[c.id] = ''; });
  if(!data.theme) data.theme = {bg:'#ffffff', accent:'#DFFF00', headerColor:'#DFFF00', bgImage:null};
  if(!data.theme.headerColor) data.theme.headerColor = '#DFFF00';
  if(!data.finance) data.finance = JSON.parse(JSON.stringify(FINANCE_DEFAULT));
  if(!data.finance.debts) data.finance.debts = JSON.parse(JSON.stringify(FINANCE_DEFAULT.debts));
  ['A1','A2','A3','A4','A5'].forEach(k=>{ if(!data.finance.debts[k]) data.finance.debts[k] = {name:k, total:0}; });
  if(!data.finance.months) data.finance.months = {};
  if(!data.finance.reserveTarget) data.finance.reserveTarget = 200000;
  if(!data.finance.debtSectionTitle) data.finance.debtSectionTitle = '項目設定';
  if(data.finance.debtSectionTitle==='欠款項目設定（可隨時修改，一次性設定）') data.finance.debtSectionTitle = '項目設定';
  if(!data.finance.customFixed) data.finance.customFixed = [];
  if(!data.finance.customIncome) data.finance.customIncome = [];
  if(!data.finance.labels) data.finance.labels = {income:{}, fixed:{}, pct:{}, summary:{}};
  ['income','fixed','pct','summary'].forEach(t=>{ if(!data.finance.labels[t]) data.finance.labels[t] = {}; });
  if(!data.categoryOrder) data.categoryOrder = [];
  CATEGORIES.forEach(c=>{ if(!data.categoryOrder.includes(c.id)) data.categoryOrder.push(c.id); });
  if(!data.categoryOrder.includes('yeargoal')) data.categoryOrder.unshift('yeargoal');
  data.categoryOrder = data.categoryOrder.filter(id=>id==='yeargoal' || CATEGORIES.some(c=>c.id===id));
  const shop = CATEGORIES.find(c=>c.id==='shopping');
  const hasShop = data.items.some(it=>it.category==='shopping');
  if(!hasShop){
    const nowKey = monthKeyFromDate(new Date());
    shop.defaultItems.forEach(name=>{
      data.items.push({id:uid(), category:'shopping', name, createdMonth:nowKey, completedMonth:null});
    });
  }
}
function darkenColor(hex, amt){
  hex = (hex||'#DFFF00').replace('#','');
  if(hex.length===3){ hex = hex.split('').map(c=>c+c).join(''); }
  const num = parseInt(hex,16) || 0xDFFF00;
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  r = Math.max(0, Math.round(r*(1-amt)));
  g = Math.max(0, Math.round(g*(1-amt)));
  b = Math.max(0, Math.round(b*(1-amt)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyTheme(theme){
  if(!theme) return;
  const root = document.documentElement;
  const bg = theme.bg || '#ffffff';
  const accent = theme.accent || '#DFFF00';
  const headerColor = theme.headerColor || '#DFFF00';
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-dark', darkenColor(accent, 0.4));
  root.style.setProperty('--bg', bg);
  root.style.setProperty('--cathead', headerColor);
  if(theme.bgImage){
    // keep cards opaque/white so text stays readable over a photo background
    root.style.setProperty('--card', '#ffffff');
    document.getElementById('bgLayer').style.backgroundImage = 'url(' + theme.bgImage + ')';
  }else{
    // no photo: tint cards to match the chosen background so the color change is clearly visible
    root.style.setProperty('--card', bg);
    document.getElementById('bgLayer').style.backgroundImage = '';
  }
}
function updatePhotoPreviewUI(){
  const wrap = document.getElementById('bgPhotoPreviewWrap');
  const img = document.getElementById('bgPhotoPreview');
  if(draftTheme && draftTheme.bgImage){
    img.src = draftTheme.bgImage;
    wrap.style.display = 'flex';
  }else{
    wrap.style.display = 'none';
  }
}
function openSettingsModal(){
  draftTheme = JSON.parse(JSON.stringify(data.theme || {bg:'#ffffff', accent:'#DFFF00', headerColor:'#DFFF00', bgImage:null}));
  document.getElementById('bgColorInput').value = draftTheme.bg || '#ffffff';
  document.getElementById('accentColorInput').value = draftTheme.accent || '#DFFF00';
  document.getElementById('headerColorInput').value = draftTheme.headerColor || '#DFFF00';
  updatePhotoPreviewUI();
  document.getElementById('settingsOverlay').style.display = 'flex';
}
function closeSettingsModal(){
  document.getElementById('settingsOverlay').style.display = 'none';
}
function handlePhotoFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 2000;
      let w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      draftTheme.bgImage = canvas.toDataURL('image/jpeg', 0.9);
      applyTheme(draftTheme);
      updatePhotoPreviewUI();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function confirmRename(){

      data.appTitle = trimmed;
      document.title = trimmed;

      data.finance.debtSectionTitle = trimmed;
      save();

      if(titleEl) titleEl.textContent = trimmed;
      return;
    }else if(renamingId.indexOf('finlabel:')===0){

      const type = parts[1], key = parts[2];
      if(type==='customfixed'){
        const c = data.finance.customFixed.find(x=>x.id===key);
        if(c) c.name = trimmed;
      }else if(type==='customincome'){
        const c = data.finance.customIncome.find(x=>x.id===key);
        if(c) c.name = trimmed;
      }else{
        data.finance.labels[type][key] = trimmed;
      }
      save();
      closeRenameModal();
      const labelEl = document.getElementById('finLabelText_'+type+'_'+key);
      if(labelEl) labelEl.textContent = trimmed;
      return;
    }else if(renamingId.indexOf('item:')===0){
      const itemId = renamingId.slice(5);
      const it = data.items.find(i=>i.id===itemId);
      if(it) it.name = trimmed;

function moveCategory(id, delta){
  const idx = data.categoryOrder.indexOf(id);
  const newIdx = idx + delta;
  if(idx<0 || newIdx<0 || newIdx>=data.categoryOrder.length) return;
  const arr = data.categoryOrder;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];

function itemsForCategoryMonth(catId, mKey){

function getCheck(key, mKey){
  return !!(data.recurringChecks[key] && data.recurringChecks[key][mKey]);
}
function toggleCheck(key, mKey){
  if(!data.recurringChecks[key]) data.recurringChecks[key]={};
  data.recurringChecks[key][mKey] = !data.recurringChecks[key][mKey];
  save(); render();
}
function getCount(key, mKey){
  return (data.recurringCounts[key] && data.recurringCounts[key][mKey]) || 0;
}
function bumpCount(key, mKey, delta){
  if(!data.recurringCounts[key]) data.recurringCounts[key]={};
  let v = (data.recurringCounts[key][mKey]||0) + delta;
  if(v<0) v=0;
  data.recurringCounts[key][mKey]=v;
  save(); render();
}
function annualCount(key, year){
  let sum=0;
  for(let m=1;m<=12;m++){
    const mk = year+'-'+pad(m);
    sum += (data.recurringCounts[key] && data.recurringCounts[key][mk]) || 0;
  }
  return sum;
}

function catTotals(cat, mKey){
  const items = itemsForCategoryMonth(cat.id, mKey);
  let total = items.length, done = items.filter(i=>i.completedMonth===mKey).length;
  if(cat.recurringCount){ total+=1; if(getCount(cat.recurringCount.key+':'+cat.id, mKey)>=cat.recurringCount.target) done+=1; }
  if(cat.recurringCheck){ total+=1; if(getCheck(cat.recurringCheck.key+':'+cat.id, mKey)) done+=1; }
  if(cat.financeLink){ total+=1; if(data.finance.months[mKey]) done+=1; }
  return {total, done};
}

function emptyFinanceMonth(){
  return {

    pct:{reserve:30, savings:30, fund:35, invest:5},
    note:''
  };
}
function getFinanceMonth(mKey){
  return data.finance.months[mKey] || emptyFinanceMonth();
}
const RESERVE_TARGET_DEFAULT = 200000;
function getReserveTarget(){
  return (data.finance && data.finance.reserveTarget) || RESERVE_TARGET_DEFAULT;
}

function financeMonthCalc(mKey){
  const m = getFinanceMonth(mKey);
  const customIncomeIds = (data.finance.customIncome||[]).map(c=>c.id);
  const incomeTotal = ['work','project','side', ...customIncomeIds]
    .reduce((s,k)=> s+(m.income[k]||0), 0);
  const customFixedIds = (data.finance.customFixed||[]).map(c=>c.id);
  const fixedTotal = ['A1','A2','A3','A4','A5','rent','transport','food','utilities','insurance','software','other', ...customFixedIds]
    .reduce((s,k)=> s+(m.fixed[k]||0), 0);
  const remain = incomeTotal - fixedTotal;
  const debtPaid = (m.fixed.A1||0)+(m.fixed.A2||0)+(m.fixed.A3||0)+(m.fixed.A4||0)+(m.fixed.A5||0);
  return {incomeTotal, fixedTotal, remain, debtPaid};
}
// One step of the sequential walk: before the reserve fund reaches RESERVE_TARGET,
// 100% of that month's remain goes to the reserve fund; once it has reached the target
// (as of the END of a month), the percentage split (pct.reserve/savings/fund/invest) applies
// starting the following month.
function financeSeqStep(mKey, unlockedAtStart){
  const m = getFinanceMonth(mKey);
  const c = financeMonthCalc(mKey);
  let alloc;
  if(!unlockedAtStart){
    alloc = {reserve:c.remain, savings:0, fund:0, invest:0};
  }else{
    const p = m.pct;
    alloc = {
      reserve: Math.round(c.remain * (p.reserve||0)/100),
      savings: Math.round(c.remain * (p.savings||0)/100),
      fund: Math.round(c.remain * (p.fund||0)/100),
      invest: Math.round(c.remain * (p.invest||0)/100)
    };
  }
  return {...c, alloc};
}
function financeStateBefore(mKey){
  const keys = Object.keys(data.finance.months).filter(k=>k<mKey).sort();
  let reserve=0, savings=0, fund=0, invest=0, debtPaid=0, unlocked=false;
  keys.forEach(k=>{
    const c = financeSeqStep(k, unlocked);
    reserve+=c.alloc.reserve; savings+=c.alloc.savings; fund+=c.alloc.fund; invest+=c.alloc.invest;
    debtPaid+=c.debtPaid;
    if(!unlocked && reserve>=getReserveTarget()) unlocked = true;
  });
  return {reserve, savings, fund, invest, debtPaid, unlocked};
}
function financeCumulativeUpTo(mKey){
  const keys = Object.keys(data.finance.months).filter(k=>k<=mKey).sort();
  let reserve=0, savings=0, fund=0, invest=0, debtPaid=0, unlocked=false;
  keys.forEach(k=>{
    const c = financeSeqStep(k, unlocked);
    reserve+=c.alloc.reserve; savings+=c.alloc.savings; fund+=c.alloc.fund; invest+=c.alloc.invest;
    debtPaid+=c.debtPaid;
    if(!unlocked && reserve>=getReserveTarget()) unlocked = true;
  });
  return {reserve, savings, fund, invest, debtPaid};
}
function financeDebtTotalInit(){
  return ['A1','A2','A3','A4','A5'].reduce((s,k)=> s+(data.finance.debts[k].total||0), 0);
}
function financeDebtPaidTotal(k){
  let sum = 0;
  Object.keys(data.finance.months).forEach(mk=>{
    const m = data.finance.months[mk];
    sum += (m.fixed && m.fixed[k]) || 0;
  });
  return sum;
}
function financeDebtRemainPerItem(k){
  return (data.finance.debts[k].total||0) - financeDebtPaidTotal(k);
}
function financeSummaryUpTo(mKey){
  const cum = financeCumulativeUpTo(mKey);
  const debtRemaining = financeDebtTotalInit() - cum.debtPaid;
  const totalAssets = cum.reserve+cum.savings+cum.fund+cum.invest - debtRemaining;
  return {...cum, debtRemaining, totalAssets};
}
function fmtMoney(n){
  n = Math.round(n||0);
  const sign = n<0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US');
}
function fmtNum(n){
  n = Math.round(n||0);
  const sign = n<0 ? '-' : '';
  return sign + Math.abs(n).toLocaleString('en-US');
}

function monthsCheckedInYear(key, year){
  let n=0;
  for(let m=1;m<=12;m++){ if(getCheck(key, year+'-'+pad(m))) n++; }
  return n;
}

function renderYearView(){
  const year = yearOf(curMonth);
  let html = '';
  yearBlocksOrder().forEach(block=>{
    if(block.type==='goal'){
      const goalText = data.yearGoals[year] || '';
      html += `<div class="goal-card" data-cat="yeargoal">
        <div class="goal-title-row"><span class="goal-title">${year} 年度目標</span><div class="drag-handle" data-drag="yeargoal"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div></div>
        <textarea class="goal-input" id="goalInput" placeholder="寫下這一年想達成的目標…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${escapeHtml(goalText)}</textarea>
        <div class="goal-saved" id="goalSaved"></div>
      </div>`;
      return;
    }

    const cat = block.cat;
    // items completed sometime within this year
    const doneItems = data.items.filter(it=>it.category===cat.id && it.completedMonth && it.completedMonth.slice(0,4)===year);
    // items still open right now (regardless of year), that already existed by this year
    const undoneItems = data.items.filter(it=>it.category===cat.id && it.completedMonth===null && it.createdMonth.slice(0,4)<=year);

    let total = doneItems.length + undoneItems.length;
    let done = doneItems.length;
    if(cat.recurringCount) total += 1;
    if(cat.recurringCheck) total += 1;
    let recurringDoneBonus = 0;
    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      if(annualCount(key, year) >= 12*cat.recurringCount.target) recurringDoneBonus++;
    }
    if(cat.recurringCheck){
      const key = cat.recurringCheck.key+':'+cat.id;
      if(monthsCheckedInYear(key, year)===12) recurringDoneBonus++;
    }
    done += recurringDoneBonus;

    html += `<div class="yr-card" data-cat="${cat.id}">
      <div class="yr-title"><span class="yr-cat-name" data-editname="${cat.id}">${catNameHtml(cat)}</span><div class="yr-title-right"><span class="yr-sub">${done}/${total}（年度）</span><div class="drag-handle" data-drag="${cat.id}"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div></div></div>

      <div class="yr-col-label">已完成項目</div>

    if(doneItems.length===0) html += `<span class="tag empty">—</span>`;

    });
    html += `</div>

      <div class="yr-col-label">尚未完成項目</div>
      <div class="yr-tags">`;
    if(undoneItems.length===0) html += `<span class="tag empty">—</span>`;
    undoneItems.forEach(it=>{
      html += `<span class="tag">${escapeHtml(it.name)}</span>`;
    });
    html += `</div>`;

    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      const ac = annualCount(key, year);
      html += `<div class="run-note">${cat.recurringCount.key}年度累計：<b>${ac} / ${12*cat.recurringCount.target}</b></div>`;
    }
    if(cat.recurringCheck){

      const mc = monthsCheckedInYear(key, year);
      html += `<div class="run-note">${cat.recurringCheck.key}完成月數：<b>${mc} / 12</b></div>`;
    }
    html += `</div>`;
  });

  return html;

function readFinanceDraftFromDOM(){
  const income = {};
  document.querySelectorAll('[data-fin-income]').forEach(el=>{
    income[el.getAttribute('data-fin-income')] = parseFloat(el.value)||0;
  });
  const fixed = {};
  document.querySelectorAll('[data-fin-fixed]').forEach(el=>{
    fixed[el.getAttribute('data-fin-fixed')] = parseFloat(el.value)||0;
  });
  const pct = {};
  document.querySelectorAll('[data-fin-pct]').forEach(el=>{
    pct[el.getAttribute('data-fin-pct')] = parseFloat(el.value)||0;
  });
  return {income, fixed, pct};
}

function recalcFinanceLive(){
  const draft = readFinanceDraftFromDOM();
  const incomeTotal = Object.values(draft.income).reduce((a,b)=>a+b, 0);
  const fixedTotal = Object.values(draft.fixed).reduce((a,b)=>a+b, 0);
  const remain = incomeTotal - fixedTotal;
  const incEl = document.getElementById('finIncomeTotal'); if(incEl) incEl.textContent = fmtMoney(incomeTotal);
  const fixEl = document.getElementById('finFixedTotal'); if(fixEl) fixEl.textContent = fmtMoney(fixedTotal);
  const remEl = document.getElementById('finRemainValue'); if(remEl) remEl.textContent = fmtMoney(remain);

  const before = financeStateBefore(curMonth);
  const gateEl = document.getElementById('finGateStatus');
  let pctSum = 0;
  Object.keys(FIN_PCT_LABELS).forEach(k=>{ pctSum += (draft.pct[k]||0); });

  if(!before.unlocked){
    const gap = Math.max(0, getReserveTarget() - before.reserve);
    if(gateEl) gateEl.innerHTML = `尚未達 ${fmtMoney(getReserveTarget())}（目前累積 ${fmtMoney(before.reserve)}，還差 ${fmtMoney(gap)}）— 本月剩餘金額會 100% 進備用金，比例分配下方僅供參考，達標下個月才會啟用。`;
    ['reserve','savings','fund','invest'].forEach(k=>{
      const allocEl = document.getElementById('finAlloc_'+k);
      if(allocEl) allocEl.textContent = k==='reserve' ? fmtMoney(remain) : fmtMoney(0);
    });
  }else{
    if(gateEl) gateEl.innerHTML = `已達 ${fmtMoney(getReserveTarget())} 備用金目標，本月依下方比例分配。`;
    Object.keys(FIN_PCT_LABELS).forEach(k=>{
      const p = draft.pct[k]||0;
      const allocEl = document.getElementById('finAlloc_'+k);
      if(allocEl) allocEl.textContent = fmtMoney(Math.round(remain*p/100));
    });
  }
  const warnEl = document.getElementById('finPctWarn');
  if(warnEl){
    warnEl.textContent = Math.round(pctSum)===100 ? '' : ('分配比例合計 '+pctSum+'%（建議合計為 100%）');
  }
}

function initDragHandle(handle){
  const LONG_PRESS_MS = 320;
  const MOVE_CANCEL_PX = 8;
  let pressTimer = null;
  let startX=0, startY=0;
  let dragging = false;
  let card = null, placeholder = null, container = null;
  let cardTop=0, cardLeft=0, cardWidth=0, cardHeight=0;

  function cleanup(){
    dragging = false;
    if(card){
      card.classList.remove('dragging');
      card.style.position='';
      card.style.top='';
      card.style.left='';
      card.style.width='';
      card.style.margin='';
    }
    if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    card = null; placeholder = null; container = null;
  }

  function onMove(e){
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    if(!dragging){
      if(Math.abs(y-startY) > MOVE_CANCEL_PX || Math.abs(x-startX) > MOVE_CANCEL_PX){
        clearTimeout(pressTimer);
      }
      return;
    }
    e.preventDefault();
    const dy = y - startY;
    card.style.top = (cardTop + dy) + 'px';

    const centerY = cardTop + dy + cardHeight/2;
    const siblings = Array.from(container.querySelectorAll('[data-cat]')).filter(c=>c!==card);
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      const sibCenter = r.top + r.height/2;
      if(centerY < sibCenter && sib.compareDocumentPosition(placeholder) & Node.DOCUMENT_POSITION_FOLLOWING){
        container.insertBefore(placeholder, sib);
        break;
      }
      if(centerY > sibCenter && sib.compareDocumentPosition(placeholder) & Node.DOCUMENT_POSITION_PRECEDING){
        container.insertBefore(placeholder, sib.nextSibling);
        break;
      }
    }
  }

  function onUp(){
    clearTimeout(pressTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if(!dragging){ cleanup(); return; }

    container.insertBefore(card, placeholder);
    const newOrder = Array.from(container.querySelectorAll('[data-cat]')).map(c=>c.getAttribute('data-cat'));
    cleanup();
    data.categoryOrder = newOrder;
    save(); render();
  }

  handle.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    startX = e.clientX; startY = e.clientY;
    card = handle.closest('[data-cat]');
    container = card.parentElement;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{
      dragging = true;
      const r = card.getBoundingClientRect();
      cardTop = r.top; cardLeft = r.left; cardWidth = r.width; cardHeight = r.height;
      placeholder = document.createElement('div');
      placeholder.className = 'drop-placeholder';
      placeholder.style.height = cardHeight + 'px';
      container.insertBefore(placeholder, card);
      card.classList.add('dragging');
      card.style.position='fixed';
      card.style.top = cardTop+'px';
      card.style.left = cardLeft+'px';
      card.style.width = cardWidth+'px';
      card.style.margin = '0';
      if(navigator.vibrate) navigator.vibrate(8);
    }, LONG_PRESS_MS);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

function bindEvents(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{

  });

  });
  document.querySelectorAll('[data-bump]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const [key, d] = el.getAttribute('data-bump').split('|');
      bumpCount(key, curMonth, parseInt(d));
    };
  });
  document.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const catId = el.getAttribute('data-add');
      const input = document.querySelector(`[data-input="${catId}"]`);
      addItem(catId, input.value);
      input.value='';
    };
  });
  document.querySelectorAll('[data-input]').forEach(el=>{
    el.onclick = (e)=>e.stopPropagation();
    el.onkeydown = (e)=>{
      if(e.key==='Enter'){
        const catId = el.getAttribute('data-input');
        addItem(catId, el.value);
        el.value='';
      }
    };
  });

  const goalInput = document.getElementById('goalInput');
  if(goalInput){
    let t;
    goalInput.oninput = ()=>{
      const year = yearOf(curMonth);
      data.yearGoals[year] = goalInput.value;
      clearTimeout(t);
      const saved = document.getElementById('goalSaved');

    };
  }

  document.getElementById('accentColorInput').value = draftTheme.accent;
  document.getElementById('headerColorInput').value = draftTheme.headerColor;
  updatePhotoPreviewUI();
  applyTheme(draftTheme);
};
document.getElementById('settingsCancelBtn').onclick = ()=>{
  applyTheme(data.theme);
  closeSettingsModal();
};
document.getElementById('settingsSaveBtn').onclick = ()=>{
  data.theme = draftTheme;
  save();
  applyTheme(data.theme);
  closeSettingsModal();
};

load();
</script>
</body>
</html>
