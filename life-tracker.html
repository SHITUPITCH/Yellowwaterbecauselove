<title>Professsor Wong</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --sub:#3a3a3c;
    --faint:#b3b3b8;
    --line:#ececec;
    --card:#fbfbfb;
    --accent:#DFFF00;
    --accent-dark:#8fa300;
    --cathead:#DFFF00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  input, textarea{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text;}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  #bgLayer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;
    background-repeat:no-repeat;pointer-events:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;padding:0 0 60px;}

  header.top{position:sticky;top:0;background:var(--card);backdrop-filter:blur(8px);
    z-index:10;padding:18px 20px 10px;border-bottom:1px solid var(--line);}
  .title{font-size:20px;font-weight:600;letter-spacing:.2px;margin:0 0 12px;cursor:pointer;min-height:26px;display:block;}
  .title:active{opacity:.6;}
  .title-row{display:flex;align-items:center;justify-content:space-between;}
  .settings-btn{width:32px;height:32px;margin-bottom:12px;border:none;border-radius:50%;
    background:#f2f2f4;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .settings-btn:active{background:#e6e6e8;}
  .tabs{display:flex;background:#f2f2f4;border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:14px;border-radius:8px;color:var(--sub);
    cursor:pointer;font-weight:500;transition:.15s;}
  .tab.active{background:#ffffff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 0 2px;}
  .navbtn{width:30px;height:30px;border-radius:50%;border:none;background:#f2f2f4;color:var(--text);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .navbtn:active{background:#e6e6e8;}
  .navlabel{font-size:15px;font-weight:600;min-width:110px;text-align:center;}

  main{padding:14px 16px 0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;
    -webkit-touch-callout:none;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--cathead);}
  .cat-name{font-size:15.5px;font-weight:600;color:var(--text);cursor:pointer;min-width:60px;min-height:20px;display:inline-block;}
  .cat-name:active{opacity:.6;}
  .yr-cat-name{cursor:pointer;min-width:60px;min-height:18px;display:inline-block;}
  .yr-cat-name:active{opacity:.6;}
  .name-placeholder{color:var(--faint);font-weight:500;font-style:italic;}
  .cat-head .name-placeholder{color:rgba(0,0,0,.4);}
  .cat-right{display:flex;align-items:center;gap:8px;}
  .cat-count{font-size:13px;color:rgba(0,0,0,.45);font-variant-numeric:tabular-nums;}
  .chev{font-size:11px;color:rgba(0,0,0,.4);transition:transform .2s;}
  .card.open .chev{transform:rotate(90deg);}
  .drag-handle{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    -webkit-touch-callout:none;-webkit-user-select:none;
    color:var(--faint);cursor:grab;touch-action:none;user-select:none;flex:0 0 auto;}
  .cat-head .drag-handle{color:rgba(0,0,0,.4);}
  .dragging{opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.18);z-index:50;}
  .dragging .drag-handle{color:var(--text);cursor:grabbing;}
  .drop-placeholder{border:1.5px dashed #d5d5d8;border-radius:14px;margin-bottom:10px;background:#f7f7f8;}

  .cat-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .card.open .cat-body{max-height:1200px;}
  .cat-inner{padding:0 16px 14px;}

  .item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--cathead);}
  .item-row:first-child{border-top:none;}
  .check{width:20px;height:20px;border-radius:6px;border:1.6px solid #d5d5d8;flex:0 0 20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;}
  .check.done{background:var(--accent);border-color:var(--accent);}
  .check svg{width:12px;height:12px;display:none;}
  .check.done svg{display:block;}
  .item-name{flex:1;font-size:14.5px;color:var(--sub);cursor:pointer;}
  .item-name.done{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint);}
  .del{color:var(--faint);font-size:15px;cursor:pointer;padding:2px 4px;flex:0 0 auto;}

  .counter-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--cathead);}
  .counter-row:first-child{border-top:none;}
  .finance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
    border-top:1px solid var(--cathead);cursor:pointer;}
  .finance-row:first-child{border-top:none;}

function darkenColor(hex, amt){
  hex = (hex||'#DFFF00').replace('#','');
  if(hex.length===3){ hex = hex.split('').map(c=>c+c).join(''); }
  const num = parseInt(hex,16) || 0xDFFF00;
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  r = Math.max(0, Math.round(r*(1-amt)));
  g = Math.max(0, Math.round(g*(1-amt)));
  b = Math.max(0, Math.round(b*(1-amt)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyTheme(theme){
  if(!theme) return;
  const root = document.documentElement;

  const headerColor = theme.headerColor || '#DFFF00';
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-dark', darkenColor(accent, 0.4));
  root.style.setProperty('--bg', bg);

  }
}

function handlePhotoFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 2000;
      let w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      draftTheme.bgImage = canvas.toDataURL('image/jpeg', 0.9);
      applyTheme(draftTheme);
      updatePhotoPreviewUI();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function financeMonthCalcItemized(m){
  const customIncomeIds = (data.finance.customIncome||[]).map(c=>c.id);
  const incomeTotal = ['work','project','side', ...customIncomeIds]
    .reduce((s,k)=> s+(m.income[k]||0), 0);
  const debtPaid = (m.fixed.A1||0)+(m.fixed.A2||0)+(m.fixed.A3||0)+(m.fixed.A4||0)+(m.fixed.A5||0);
  const customFixedIds = (data.finance.customFixed||[]).map(c=>c.id);
  const otherExpense = ['rent','transport','food','utilities','insurance','software','other', ...customFixedIds]
    .reduce((s,k)=> s+(m.fixed[k]||0), 0);
  const fixedTotal = debtPaid + otherExpense;
  const remain = incomeTotal - fixedTotal;
  return {incomeTotal, fixedTotal, remain, debtPaid};
}
// One step of the sequential walk.
// runningBalance = the account's running total carried in from the previous month.
//   - manual/balance-mode months set it directly to whatever total the person reads off their account.
//   - itemized months add that month's flow (income - expenses) on top of the previous running total.
// Before the reserve fund has ever reached the target, 100% of the running balance IS the reserve
// (nothing else exists yet). Once unlocked (the target was reached at the end of some month),
// every month from then on the reserve stays fixed at the target amount as a floor, and only the
// EXCESS above that floor gets split by percentage into reserve/savings/fund/invest — so money that
// was already counted as reserve is never re-split.
function financeSeqStep(mKey, unlockedAtStart, runningBalanceIn){
  const m = getFinanceMonth(mKey);
  const debtPaid = (m.fixed.A1||0)+(m.fixed.A2||0)+(m.fixed.A3||0)+(m.fixed.A4||0)+(m.fixed.A5||0);
  let remain, incomeTotal=0, fixedTotal=0, runningBalance;
  if(m.manualMode){
    runningBalance = m.accountBalance||0;
    remain = runningBalance - (runningBalanceIn||0);
  }else{
    const c = financeMonthCalcItemized(m);
    incomeTotal = c.incomeTotal; fixedTotal = c.fixedTotal; remain = c.remain;
    runningBalance = (runningBalanceIn||0) + remain;
  }
  const target = getReserveTarget();
  let alloc, unlockedOut;
  if(!unlockedAtStart){
    alloc = {reserve:runningBalance, savings:0, fund:0, invest:0};
    unlockedOut = runningBalance >= target;
  }else{
    const excess = Math.max(0, runningBalance - target);
    const p = m.pct;
    alloc = {
      reserve: target + Math.round(excess * (p.reserve||0)/100),
      savings: Math.round(excess * (p.savings||0)/100),
      fund: Math.round(excess * (p.fund||0)/100),
      invest: Math.round(excess * (p.invest||0)/100)
    };
    unlockedOut = true;
  }
  return {incomeTotal, fixedTotal, remain, debtPaid, alloc, runningBalance, unlockedOut};
}
function financeMonthCalc(mKey){
  const before = financeStateBefore(mKey);
  const step = financeSeqStep(mKey, before.unlocked, before.lastBalance);
  return {incomeTotal:step.incomeTotal, fixedTotal:step.fixedTotal, remain:step.remain, debtPaid:step.debtPaid};
}
function financeStateBefore(mKey){
  const keys = Object.keys(data.finance.months).filter(k=>k<mKey).sort();
  let unlocked=false, runningBalance=0, debtPaid=0;
  let lastAlloc = {reserve:0, savings:0, fund:0, invest:0};
  keys.forEach(k=>{
    const step = financeSeqStep(k, unlocked, runningBalance);
    unlocked = step.unlockedOut;
    runningBalance = step.runningBalance;
    debtPaid += step.debtPaid;
    lastAlloc = step.alloc;
  });
  return {reserve:lastAlloc.reserve, savings:lastAlloc.savings, fund:lastAlloc.fund, invest:lastAlloc.invest, debtPaid, unlocked, lastBalance:runningBalance};
}
function financeCumulativeUpTo(mKey){
  const keys = Object.keys(data.finance.months).filter(k=>k<=mKey).sort();
  let unlocked=false, runningBalance=0, debtPaid=0;
  let lastAlloc = {reserve:0, savings:0, fund:0, invest:0};
  keys.forEach(k=>{
    const step = financeSeqStep(k, unlocked, runningBalance);
    unlocked = step.unlockedOut;
    runningBalance = step.runningBalance;
    debtPaid += step.debtPaid;
    lastAlloc = step.alloc;
  });
  return {reserve:lastAlloc.reserve, savings:lastAlloc.savings, fund:lastAlloc.fund, invest:lastAlloc.invest, debtPaid};
}
function financeDebtTotalInit(){
  return ['A1','A2','A3','A4','A5'].reduce((s,k)=> s+(data.finance.debts[k].total||0), 0);
}
function financeDebtPaidTotal(k){
  let sum = 0;
  Object.keys(data.finance.months).forEach(mk=>{
    const m = data.finance.months[mk];
    sum += (m.fixed && m.fixed[k]) || 0;
  });
  return sum;
}
function financeDebtRemainPerItem(k){
  return (data.finance.debts[k].total||0) - financeDebtPaidTotal(k);
}
function financeSummaryUpTo(mKey){
  const cum = financeCumulativeUpTo(mKey);
  const debtRemaining = financeDebtTotalInit() - cum.debtPaid;
  const totalAssets = cum.reserve+cum.savings+cum.fund+cum.invest - debtRemaining;
  return {...cum, debtRemaining, totalAssets};
}

function bumpCountSilent(key, mKey, delta){
  if(!data.recurringCounts[key]) data.recurringCounts[key]={};
  let v = (data.recurringCounts[key][mKey]||0) + delta;
  if(v<0) v=0;
  data.recurringCounts[key][mKey]=v;
}
function onDaySlotTap(dateStr, slotIdx){
  const mKey = curMonth;
  const sched = getSchedule(mKey);
  if(!sched.calendar[dateStr]) sched.calendar[dateStr] = [];
  const entries = sched.calendar[dateStr];
  if(slotIdx < entries.length){
    const cur = entries[slotIdx];
    if(cur==='EXERCISE'){ bumpCountSilent(EXERCISE_KEY, mKey, -1); }
    entries.splice(slotIdx, 1);
    save();
    render();
  }else{
    openDaySlotPicker(dateStr, entries.length);
  }
}

function renderScheduleView(){
  const mKey = curMonth;
  const sched = getSchedule(mKey);

  const totalDays = daysInMonth(mKey);
  const firstWeekday = weekdayMon0(y,m,1);

  for(let d=1; d<=totalDays; d++){
    const dateStr = mKey+'-'+pad(d);
    const isLast = d===totalDays;
    const entries = sched.calendar[dateStr] || [];
    const slotCount = entries.length < 3 ? 3 : entries.length + 1;
    html += `<div class="sch-cell"><div class="sch-daynum">${d}</div><div class="sch-slots">`;
    for(let s=0; s<slotCount; s++){

          html += `<div class="sch-slot sch-slot-filled" data-daycell="${dateStr}|${s}" title="${it?escapeHtml(it.name):''}">${label}</div>`;

function renderMonthPlanColumn(mKey, sched){
  const available = scheduleAvailableItems(mKey);
  const selectedActive = sched.selected.filter(id=>{
    const it = data.items.find(x=>x.id===id);
    return it && it.completedMonth!==mKey;
  });
  const buckets = {important:[], normal:[], notUrgent:[]};
  selectedActive.forEach(id=>{
    const p = sched.priority[id];
    if(p) (buckets[p] || buckets.normal).push(id);
  });

  let html = '<div class="sch-col">';
  html += '<div class="sch-col-title">本月計劃</div>';
  html += '<div class="sch-pick-title">選擇項目（點選；長按已選項目可拖到分類）</div><div class="sch-pick-list">';
  if(available.length===0){
    html += '<div class="empty-state" style="padding:10px 0;">本月尚無項目</div>';
  }
  available.forEach(it=>{
    const on = sched.selected.includes(it.id);
    const dragAttr = on ? `data-schitem="${it.id}"` : '';
    html += `<div class="sch-pick-chip ${on?'on':''}" data-schedpick="${it.id}" ${dragAttr}>${escapeHtml(it.name)}</div>`;
  });
  html += '</div>';

  const bucketLabels = {important:'重要', normal:'一般', notUrgent:'不急'};
  ['important','normal','notUrgent'].forEach(p=>{
    html += `<div class="sch-bucket-title">${bucketLabels[p]}</div><div class="sch-bucket" data-bucket="${p}">`;
    buckets[p].forEach(id=>{
      const it = data.items.find(x=>x.id===id);
      if(it) html += `<div class="sch-chip" data-schitem="${id}">${escapeHtml(it.name)}</div>`;
    });
    if(buckets[p].length===0) html += '<div class="sch-bucket-empty">長按項目拖到這裡</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderCompletedColumn(mKey, sched){
  const completedIds = sched.selected.filter(id=>{
    const it = data.items.find(x=>x.id===id);
    return it && it.completedMonth===mKey;
  });
  const exCount = getCount(EXERCISE_KEY, mKey);

  let html = '<div class="sch-col">';
  html += '<div class="sch-col-title">已完成</div>';

let scheduleDragCtx = null;
let scheduleJustDragged = false;
function scheduleDragPointerDown(e){
  if(view!=='schedule') return;
  const chip = e.target.closest('[data-schitem]');
  if(!chip) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  scheduleDragCtx = {chip, startX:e.clientX, startY:e.clientY, dragging:false, pressTimer:null, w:0, h:0};
  scheduleDragCtx.pressTimer = setTimeout(()=>{
    if(!scheduleDragCtx) return;
    scheduleDragCtx.dragging = true;
    scheduleJustDragged = true;
    const r = chip.getBoundingClientRect();
    scheduleDragCtx.w = r.width; scheduleDragCtx.h = r.height;
    chip.style.position='fixed';
    chip.style.left=r.left+'px'; chip.style.top=r.top+'px';
    chip.style.width=r.width+'px';
    chip.style.zIndex=999;
    chip.classList.add('dragging');
    if(navigator.vibrate) navigator.vibrate(8);
  }, 280);
}
function scheduleDragPointerMove(e){
  if(!scheduleDragCtx) return;
  const x=e.clientX, y=e.clientY;
  if(!scheduleDragCtx.dragging){
    if(Math.abs(y-scheduleDragCtx.startY)>8 || Math.abs(x-scheduleDragCtx.startX)>8){
      clearTimeout(scheduleDragCtx.pressTimer);
      scheduleDragCtx = null;
    }
    return;
  }
  e.preventDefault();
  scheduleDragCtx.chip.style.left = (x-scheduleDragCtx.w/2)+'px';
  scheduleDragCtx.chip.style.top = (y-scheduleDragCtx.h/2)+'px';
}
function scheduleDragPointerUp(e){
  if(!scheduleDragCtx) return;
  clearTimeout(scheduleDragCtx.pressTimer);
  if(!scheduleDragCtx.dragging){ scheduleDragCtx = null; return; }
  const chip = scheduleDragCtx.chip;
  const x = e.clientX, y = e.clientY;
  chip.style.display = 'none';
  const under = document.elementFromPoint(x,y);
  chip.style.display = '';
  chip.style.position=''; chip.style.left=''; chip.style.top=''; chip.style.width=''; chip.style.zIndex='';
  chip.classList.remove('dragging');
  const bucketEl = under ? under.closest('[data-bucket]') : null;
  scheduleDragCtx = null;
  setTimeout(()=>{ scheduleJustDragged = false; }, 50);
  if(bucketEl){
    applyChipDrop(chip.getAttribute('data-schitem'), bucketEl.getAttribute('data-bucket'));
  }
}

let stepDragCtx = null;
function stepDragPointerDown(e){
  const handle = e.target.closest('[data-stepdrag]');
  if(!handle) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  const card = handle.closest('[data-stepid]');
  const container = document.getElementById('stepsListContainer');
  if(!card || !container) return;
  stepDragCtx = {card, container, startX:e.clientX, startY:e.clientY, dragging:false, pressTimer:null,
    cardTop:0, cardHeight:0, placeholder:null};
  stepDragCtx.pressTimer = setTimeout(()=>{
    if(!stepDragCtx) return;
    stepDragCtx.dragging = true;
    const r = card.getBoundingClientRect();
    stepDragCtx.cardTop = r.top; stepDragCtx.cardHeight = r.height;
    const placeholder = document.createElement('div');
    placeholder.className = 'drop-placeholder';
    placeholder.style.height = r.height+'px';
    container.insertBefore(placeholder, card);
    stepDragCtx.placeholder = placeholder;
    card.classList.add('dragging');
    card.style.position='fixed';
    card.style.top=r.top+'px'; card.style.left=r.left+'px'; card.style.width=r.width+'px';
    card.style.margin='0';
    if(navigator.vibrate) navigator.vibrate(8);
  }, 320);
}
function stepDragPointerMove(e){
  if(!stepDragCtx) return;
  const x=e.clientX, y=e.clientY;
  if(!stepDragCtx.dragging){
    if(Math.abs(y-stepDragCtx.startY)>8 || Math.abs(x-stepDragCtx.startX)>8){
      clearTimeout(stepDragCtx.pressTimer);
      stepDragCtx = null;
    }
    return;
  }
  e.preventDefault();
  const dy = y - stepDragCtx.startY;
  stepDragCtx.card.style.top = (stepDragCtx.cardTop+dy)+'px';
  const centerY = stepDragCtx.cardTop + dy + stepDragCtx.cardHeight/2;
  const siblings = Array.from(stepDragCtx.container.querySelectorAll('[data-stepid]')).filter(c=>c!==stepDragCtx.card);
  for(const sib of siblings){
    const r = sib.getBoundingClientRect();
    const sibCenter = r.top + r.height/2;
    if(centerY < sibCenter && sib.compareDocumentPosition(stepDragCtx.placeholder) & Node.DOCUMENT_POSITION_FOLLOWING){
      stepDragCtx.container.insertBefore(stepDragCtx.placeholder, sib);
      break;
    }
    if(centerY > sibCenter && sib.compareDocumentPosition(stepDragCtx.placeholder) & Node.DOCUMENT_POSITION_PRECEDING){
      stepDragCtx.container.insertBefore(stepDragCtx.placeholder, sib.nextSibling);
      break;
    }
  }
}
function stepDragPointerUp(e){
  if(!stepDragCtx) return;
  clearTimeout(stepDragCtx.pressTimer);
  if(!stepDragCtx.dragging){ stepDragCtx = null; return; }
  const {card, container, placeholder} = stepDragCtx;
  container.insertBefore(card, placeholder);
  if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
  card.classList.remove('dragging');
  card.style.position=''; card.style.top=''; card.style.left=''; card.style.width=''; card.style.margin='';
  const newOrderIds = Array.from(container.querySelectorAll('[data-stepid]')).map(c=>c.getAttribute('data-stepid'));
  stepDragCtx = null;
  const steps = getItemSteps(currentDetailItemId);
  const reordered = newOrderIds.map(id=> steps.find(s=>s.id===id)).filter(Boolean);
  data.itemSteps[currentDetailItemId] = reordered;
  save();
  renderItemDetailPage();
}

function handleStepPhotoFile(stepId, file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      const steps = getItemSteps(currentDetailItemId);
      const step = steps.find(s=>s.id===stepId);
      if(step) step.image = dataUrl;
      save();
      renderItemDetailPage();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

      <button class="add-btn" data-add="${cat.id}">＋</button>
    </div>`;
    html += `</div></div></div>`;
  });
  return html;
}

function monthsCheckedInYear(key, year){
  let n=0;
  for(let m=1;m<=12;m++){ if(getCheck(key, year+'-'+pad(m))) n++; }
  return n;
}

function renderYearView(){
  const year = yearOf(curMonth);
  let html = '';
  yearBlocksOrder().forEach(block=>{
    if(block.type==='goal'){
      const goalText = data.yearGoals[year] || '';
      html += `<div class="goal-card" data-cat="yeargoal">
        <div class="goal-title-row"><span class="goal-title">${year} 年度目標</span><div class="drag-handle" data-drag="yeargoal"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div></div>
        <textarea class="goal-input" id="goalInput" placeholder="寫下這一年想達成的目標…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${escapeHtml(goalText)}</textarea>
        <div class="goal-saved" id="goalSaved"></div>
      </div>`;
      return;
    }

    const cat = block.cat;
    // items completed sometime within this year
    const doneItems = data.items.filter(it=>it.category===cat.id && it.completedMonth && it.completedMonth.slice(0,4)===year);
    // items still open right now (regardless of year), that already existed by this year
    const undoneItems = data.items.filter(it=>it.category===cat.id && it.completedMonth===null && it.createdMonth.slice(0,4)<=year);

    let total = doneItems.length + undoneItems.length;
    let done = doneItems.length;
    if(cat.recurringCount) total += 1;
    if(cat.recurringCheck) total += 1;
    let recurringDoneBonus = 0;
    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      if(annualCount(key, year) >= 12*cat.recurringCount.target) recurringDoneBonus++;
    }
    if(cat.recurringCheck){
      const key = cat.recurringCheck.key+':'+cat.id;
      if(monthsCheckedInYear(key, year)===12) recurringDoneBonus++;
    }
    done += recurringDoneBonus;

    html += `<div class="yr-card" data-cat="${cat.id}">
      <div class="yr-title"><span class="yr-cat-name" data-editname="${cat.id}">${catNameHtml(cat)}</span><div class="yr-title-right"><span class="yr-sub">${done}/${total}（年度）</span><div class="drag-handle" data-drag="${cat.id}"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div></div></div>

      <div class="yr-col-label">已完成項目</div>
      <div class="yr-tags">`;
    if(doneItems.length===0) html += `<span class="tag empty">—</span>`;
    doneItems.forEach(it=>{
      html += `<span class="tag done">✓ ${escapeHtml(it.name)}</span>`;
    });
    html += `</div>

      <div class="yr-col-label">尚未完成項目</div>
      <div class="yr-tags">`;
    if(undoneItems.length===0) html += `<span class="tag empty">—</span>`;
    undoneItems.forEach(it=>{
      html += `<span class="tag">${escapeHtml(it.name)}</span>`;
    });
    html += `</div>`;

    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      const ac = annualCount(key, year);
      html += `<div class="run-note">${cat.recurringCount.key}年度累計：<b>${ac} / ${12*cat.recurringCount.target}</b></div>`;
    }
    if(cat.recurringCheck){
      const key = cat.recurringCheck.key+':'+cat.id;
      const mc = monthsCheckedInYear(key, year);
      html += `<div class="run-note">${cat.recurringCheck.key}完成月數：<b>${mc} / 12</b></div>`;
    }
    html += `</div>`;
  });

  return html;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function readFinanceDraftFromDOM(){
  const income = {};
  document.querySelectorAll('[data-fin-income]').forEach(el=>{
    income[el.getAttribute('data-fin-income')] = parseFloat(el.value)||0;
  });
  const fixed = {};
  document.querySelectorAll('[data-fin-fixed]').forEach(el=>{
    fixed[el.getAttribute('data-fin-fixed')] = parseFloat(el.value)||0;
  });
  const pct = {};
  document.querySelectorAll('[data-fin-pct]').forEach(el=>{
    pct[el.getAttribute('data-fin-pct')] = parseFloat(el.value)||0;
  });
  const manualToggle = document.getElementById('finManualModeToggle');
  const manualInput = document.getElementById('finAccountBalanceInput');
  const manualMode = manualToggle ? manualToggle.checked : false;
  const accountBalance = manualInput ? (parseFloat(manualInput.value)||0) : 0;
  return {income, fixed, pct, manualMode, accountBalance};
}

function recalcFinanceLive(){
  const draft = readFinanceDraftFromDOM();
  const before = financeStateBefore(curMonth);
  const incomeTotal = Object.values(draft.income).reduce((a,b)=>a+b, 0);
  const debtPaid = ['A1','A2','A3','A4','A5'].reduce((s,k)=> s+(draft.fixed[k]||0), 0);
  let fixedTotal, remain, runningBalance;
  if(draft.manualMode){
    runningBalance = draft.accountBalance||0;
    remain = runningBalance - before.lastBalance;
    fixedTotal = null; // not meaningful in balance mode
  }else{
    const otherExpense = Object.keys(draft.fixed).filter(k=>!['A1','A2','A3','A4','A5'].includes(k)).reduce((s,k)=> s+(draft.fixed[k]||0), 0);
    fixedTotal = debtPaid + otherExpense;
    remain = incomeTotal - fixedTotal;
    runningBalance = before.lastBalance + remain;
  }
  const incEl = document.getElementById('finIncomeTotal'); if(incEl) incEl.textContent = fmtMoney(incomeTotal);
  const fixEl = document.getElementById('finFixedTotal');
  const fixLabelEl = document.getElementById('finFixedTotalLabel');
  if(draft.manualMode){
    if(fixLabelEl) fixLabelEl.textContent = '上月底餘額';
    if(fixEl) fixEl.textContent = fmtMoney(before.lastBalance);
  }else{
    if(fixLabelEl) fixLabelEl.textContent = '支出小計';
    if(fixEl) fixEl.textContent = fmtMoney(fixedTotal);
  }
  const remEl = document.getElementById('finRemainValue'); if(remEl) remEl.textContent = fmtMoney(remain);

  const target = getReserveTarget();
  const gateEl = document.getElementById('finGateStatus');
  let pctSum = 0;
  Object.keys(FIN_PCT_LABELS).forEach(k=>{ pctSum += (draft.pct[k]||0); });

  if(!before.unlocked){
    const gap = Math.max(0, target - runningBalance);
    if(gateEl) gateEl.innerHTML = gap>0
      ? `尚未達 ${fmtMoney(target)}（目前戶口總額 ${fmtMoney(runningBalance)}，還差 ${fmtMoney(gap)}）— 這個月新增的金額會 100% 進備用金，比例分配下方僅供參考，達標下個月才會啟用。`
      : `這個月戶口總額達到 ${fmtMoney(runningBalance)}，已達備用金目標 ${fmtMoney(target)}！這個月仍 100% 算進備用金，下個月開始，超過 ${fmtMoney(target)} 的部分才會依比例分配。`;
    ['reserve','savings','fund','invest'].forEach(k=>{
      const allocEl = document.getElementById('finAlloc_'+k);
      if(allocEl) allocEl.textContent = k==='reserve' ? fmtMoney(runningBalance-before.reserve) : fmtMoney(0);
    });
  }else{
    const excess = Math.max(0, runningBalance - target);
    if(gateEl) gateEl.innerHTML = `備用金固定維持 ${fmtMoney(target)} 為基礎，目前戶口總額 ${fmtMoney(runningBalance)}，超過基礎的 ${fmtMoney(excess)} 依下方比例分配。`;
    const newAlloc = {
      reserve: target + Math.round(excess*(draft.pct.reserve||0)/100),
      savings: Math.round(excess*(draft.pct.savings||0)/100),
      fund: Math.round(excess*(draft.pct.fund||0)/100),
      invest: Math.round(excess*(draft.pct.invest||0)/100)
    };
    ['reserve','savings','fund','invest'].forEach(k=>{
      const allocEl = document.getElementById('finAlloc_'+k);
      if(allocEl) allocEl.textContent = fmtMoney(newAlloc[k]-before[k]);
    });
  }
  const warnEl = document.getElementById('finPctWarn');
  if(warnEl){
    warnEl.textContent = Math.round(pctSum)===100 ? '' : ('分配比例合計 '+pctSum+'%（建議合計為 100%）');
  }
}

function bindFinLabelClicks(root){
  root.querySelectorAll('[data-finlabel]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const [type, key] = el.getAttribute('data-finlabel').split(':');
      const current = type==='customfixed'
        ? (data.finance.customFixed.find(c=>c.id===key)||{name:''}).name
        : type==='customincome'
        ? (data.finance.customIncome.find(c=>c.id===key)||{name:''}).name
        : finLabel(type, key);
      openRenameFor('finlabel:'+type+':'+key, current);
    };
  });
}

function bindFinanceEvents(){
  document.getElementById('financeDebtSectionTitle').onclick = ()=>{
    openRenameFor('financeDebtTitle', data.finance.debtSectionTitle);
  };
  const debtToggleBtn = document.getElementById('finDebtToggleBtn');

  bindFinLabelClicks(document.getElementById('financeBody'));
  document.querySelectorAll('[data-fin-income],[data-fin-fixed],[data-fin-pct]').forEach(el=>{

      save();
      updateFinanceTrackingValues();

  });
  document.querySelectorAll('[data-fin-debtnote]').forEach(el=>{
    el.oninput = (e)=>{
      const k = el.getAttribute('data-fin-debtnote');
      data.finance.debts[k].note = el.value;

  });
  document.getElementById('finReserveTargetInput').oninput = (e)=>{
    data.finance.reserveTarget = parseFloat(e.target.value)||200000;
    save();
    recalcFinanceLive();
    updateFinanceTrackingValues();
  };
  document.getElementById('finManualModeToggle').onchange = (e)=>{
    const detailRows = document.getElementById('fixedDetailRows');
    const manualRow = document.getElementById('manualExpenseRow');
    if(e.target.checked){
      detailRows.style.display = 'none';
      manualRow.style.display = '';
    }else{
      detailRows.style.display = '';
      manualRow.style.display = 'none';
    }
    recalcFinanceLive();
  };
  const manualExpenseInput = document.getElementById('finAccountBalanceInput');
  if(manualExpenseInput) manualExpenseInput.oninput = recalcFinanceLive;
  document.querySelectorAll('[data-fin-delcustom]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-fin-delcustom');
      data.finance.customFixed = data.finance.customFixed.filter(c=>c.id!==id);
      save();
      refreshFinancePagePreserveDraft();
    };
  });
  document.getElementById('finAddFixedBtn').onclick = addCustomFixedItemFromInput;
  document.getElementById('finAddFixedName').onkeydown = (e)=>{
    if(e.key==='Enter') addCustomFixedItemFromInput();
  };
  document.querySelectorAll('[data-fin-delcustomincome]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-fin-delcustomincome');
      data.finance.customIncome = data.finance.customIncome.filter(c=>c.id!==id);
      save();
      refreshFinancePagePreserveDraft();
    };
  });
  document.getElementById('finAddIncomeBtn').onclick = addCustomIncomeItemFromInput;
  document.getElementById('finAddIncomeName').onkeydown = (e)=>{
    if(e.key==='Enter') addCustomIncomeItemFromInput();
  };
  document.getElementById('financeSaveBtn').onclick = saveFinanceMonth;
  document.getElementById('financeResetBtn').onclick = handleFinanceResetClick;
}

function addCustomFixedItemFromInput(){
  const input = document.getElementById('finAddFixedName');
  const name = input.value.trim();
  if(!name) return;
  data.finance.customFixed.push({id:uid(), name});
  save();
  input.value = '';
  refreshFinancePagePreserveDraft();
}

function addCustomIncomeItemFromInput(){
  const input = document.getElementById('finAddIncomeName');
  const name = input.value.trim();
  if(!name) return;
  data.finance.customIncome.push({id:uid(), name});
  save();
  input.value = '';
  refreshFinancePagePreserveDraft();
}

function refreshFinancePagePreserveDraft(){
  const draft = readFinanceDraftFromDOM();
  const noteInput = document.getElementById('financeNoteInput');
  const note = noteInput ? noteInput.value : '';
  renderFinancePage();
  Object.keys(draft.income).forEach(k=>{
    const el = document.querySelector('[data-fin-income="'+k+'"]'); if(el) el.value = draft.income[k];
  });
  Object.keys(draft.fixed).forEach(k=>{
    const el = document.querySelector('[data-fin-fixed="'+k+'"]'); if(el) el.value = draft.fixed[k];
  });
  Object.keys(draft.pct).forEach(k=>{
    const el = document.querySelector('[data-fin-pct="'+k+'"]'); if(el) el.value = draft.pct[k];
  });
  const toggle = document.getElementById('finManualModeToggle');
  if(toggle){
    toggle.checked = draft.manualMode;
    const detailRows = document.getElementById('fixedDetailRows');
    const manualRow = document.getElementById('manualExpenseRow');
    if(draft.manualMode){ detailRows.style.display='none'; manualRow.style.display=''; }
    else{ detailRows.style.display=''; manualRow.style.display='none'; }
  }
  const manualInput = document.getElementById('finAccountBalanceInput');
  if(manualInput) manualInput.value = draft.accountBalance;
  const noteEl = document.getElementById('financeNoteInput'); if(noteEl) noteEl.value = note;
  recalcFinanceLive();
}

let financeResetArmed = false;
let financeResetTimer = null;
function handleFinanceResetClick(){
  const btn = document.getElementById('financeResetBtn');
  if(!financeResetArmed){
    financeResetArmed = true;
    btn.textContent = '再按一次確認重設（會清空所有理財資料）';
    btn.classList.add('armed');
    clearTimeout(financeResetTimer);
    financeResetTimer = setTimeout(()=>{
      financeResetArmed = false;
      if(btn){ btn.textContent = '重設所有理財設定與數字為預設值'; btn.classList.remove('armed'); }
    }, 4000);
  }else{
    clearTimeout(financeResetTimer);
    financeResetArmed = false;
    data.finance = JSON.parse(JSON.stringify(FINANCE_DEFAULT));
    data.finance.labels = {income:{}, fixed:{}, pct:{}, summary:{}};
    data.finance.reserveTarget = 200000;
    data.finance.debtSectionTitle = '總資產追蹤';
    data.finance.customFixed = [];
    data.finance.customIncome = [];
    save();
    renderFinancePage();
    render();
  }
}

function saveFinanceMonth(){
  const draft = readFinanceDraftFromDOM();
  const note = document.getElementById('financeNoteInput').value;
  data.finance.months[curMonth] = {
    income:draft.income, fixed:draft.fixed, pct:draft.pct,
    manualMode:draft.manualMode, accountBalance:draft.accountBalance,
    note
  };
  save();
  const noteEl = document.getElementById('financeSavedNote');
  if(noteEl){
    noteEl.textContent = '已儲存';
    setTimeout(()=>{ if(noteEl) noteEl.textContent=''; }, 1500);
  }
  updateFinanceTrackingValues();
  render();
}

function openFinancePage(){
  document.getElementById('financeOverlay').classList.add('open');
  renderFinancePage();
}
function closeFinancePage(){
  document.getElementById('financeOverlay').classList.remove('open');
}

function render(){
  document.getElementById('appTitleEl').innerHTML = appTitleHtml();
  document.title = getAppTitle() || 'Professsor Wong';
  document.getElementById('navLabel').textContent = view==='year' ? (yearOf(curMonth)+'年') : monthLabel(curMonth);
  const main = document.getElementById('main');
  main.innerHTML = view==='month' ? renderMonthView() : view==='year' ? renderYearView() : view==='schedule' ? renderScheduleView() : renderItemsListView();

function initDragHandle(handle){
  const LONG_PRESS_MS = 320;
  const MOVE_CANCEL_PX = 8;
  let pressTimer = null;
  let startX=0, startY=0;
  let dragging = false;
  let card = null, placeholder = null, container = null;
  let cardTop=0, cardLeft=0, cardWidth=0, cardHeight=0;

  function cleanup(){
    dragging = false;
    if(card){
      card.classList.remove('dragging');
      card.style.position='';
      card.style.top='';
      card.style.left='';
      card.style.width='';
      card.style.margin='';
    }
    if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    card = null; placeholder = null; container = null;
  }

  function onMove(e){
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    if(!dragging){
      if(Math.abs(y-startY) > MOVE_CANCEL_PX || Math.abs(x-startX) > MOVE_CANCEL_PX){
        clearTimeout(pressTimer);
      }
      return;
    }
    e.preventDefault();
    const dy = y - startY;
    card.style.top = (cardTop + dy) + 'px';

    const centerY = cardTop + dy + cardHeight/2;
    const siblings = Array.from(container.querySelectorAll('[data-cat]')).filter(c=>c!==card);
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      const sibCenter = r.top + r.height/2;
      if(centerY < sibCenter && sib.compareDocumentPosition(placeholder) & Node.DOCUMENT_POSITION_FOLLOWING){
        container.insertBefore(placeholder, sib);
        break;
      }
      if(centerY > sibCenter && sib.compareDocumentPosition(placeholder) & Node.DOCUMENT_POSITION_PRECEDING){
        container.insertBefore(placeholder, sib.nextSibling);
        break;
      }
    }
  }

  function onUp(){
    clearTimeout(pressTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if(!dragging){ cleanup(); return; }

    container.insertBefore(card, placeholder);
    const newOrder = Array.from(container.querySelectorAll('[data-cat]')).map(c=>c.getAttribute('data-cat'));
    cleanup();
    data.categoryOrder = newOrder;
    save(); render();
  }

  handle.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    startX = e.clientX; startY = e.clientY;
    card = handle.closest('[data-cat]');
    container = card.parentElement;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{
      dragging = true;
      const r = card.getBoundingClientRect();
      cardTop = r.top; cardLeft = r.left; cardWidth = r.width; cardHeight = r.height;
      placeholder = document.createElement('div');
      placeholder.className = 'drop-placeholder';
      placeholder.style.height = cardHeight + 'px';
      container.insertBefore(placeholder, card);
      card.classList.add('dragging');
      card.style.position='fixed';
      card.style.top = cardTop+'px';
      card.style.left = cardLeft+'px';
      card.style.width = cardWidth+'px';
      card.style.margin = '0';
      if(navigator.vibrate) navigator.vibrate(8);
    }, LONG_PRESS_MS);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

function bindEvents(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-toggle');
      openState[id] = !(openState[id] !== false);
      render();
    };
  });
  document.querySelectorAll('[data-drag]').forEach(el=>{
    initDragHandle(el);
  });
  document.querySelectorAll('[data-editname]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); renameCategory(el.getAttribute('data-editname')); };
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggleItem(el.getAttribute('data-check')); };
  });
  document.querySelectorAll('[data-checkrec]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggleCheck(el.getAttribute('data-checkrec'), curMonth); };
  });
  document.querySelectorAll('[data-openfinance]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openFinancePage(); };
  });
  document.querySelectorAll('[data-openitem]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openItemDetailPage(el.getAttribute('data-openitem')); };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteItem(el.getAttribute('data-del')); };
  });
  document.querySelectorAll('[data-edititem]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-edititem');
      const it = data.items.find(i=>i.id===id);
      if(it) openRenameFor('item:'+id, it.name);
    };
  });
  document.querySelectorAll('[data-bump]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const [key, d] = el.getAttribute('data-bump').split('|');
      bumpCount(key, curMonth, parseInt(d));
    };
  });
  document.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const catId = el.getAttribute('data-add');
      const input = document.querySelector(`[data-input="${catId}"]`);
      addItem(catId, input.value);
      input.value='';
    };
  });
  document.querySelectorAll('[data-input]').forEach(el=>{
    el.onclick = (e)=>e.stopPropagation();
    el.onkeydown = (e)=>{
      if(e.key==='Enter'){
        const catId = el.getAttribute('data-input');
        addItem(catId, el.value);
        el.value='';
      }
    };
  });

  const goalInput = document.getElementById('goalInput');
  if(goalInput){
    let t;
    goalInput.oninput = ()=>{
      const year = yearOf(curMonth);
      data.yearGoals[year] = goalInput.value;
      clearTimeout(t);
      const saved = document.getElementById('goalSaved');
      t = setTimeout(async ()=>{
        await save();
        if(saved) saved.textContent = '已儲存';
        setTimeout(()=>{ if(saved) saved.textContent=''; }, 1500);
      }, 500);
    };
  }
}
