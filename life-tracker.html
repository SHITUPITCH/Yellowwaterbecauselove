<title>Professsor Wong</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --sub:#3a3a3c;
    --faint:#b3b3b8;
    --line:#ececec;
    --card:#fbfbfb;
    --accent:#DFFF00;
    --accent-dark:#8fa300;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;padding:0 0 60px;}

  header.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    z-index:10;padding:18px 20px 10px;border-bottom:1px solid var(--line);}
  .title{font-size:20px;font-weight:600;letter-spacing:.2px;margin:0 0 12px;}
  .tabs{display:flex;background:#f2f2f4;border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:14px;border-radius:8px;color:var(--sub);
    cursor:pointer;font-weight:500;transition:.15s;}
  .tab.active{background:#ffffff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .nav{display:flex;align-items:center;justify-content:center;gap:18px;padding:2px 0 2px;}
  .navbtn{width:30px;height:30px;border-radius:50%;border:none;background:#f2f2f4;color:var(--text);
    font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .navbtn:active{background:#e6e6e8;}
  .navlabel{font-size:15px;font-weight:600;min-width:110px;text-align:center;}

  main{padding:14px 16px 0;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;}
  .cat-name{font-size:15.5px;font-weight:600;color:var(--text);}
  .cat-right{display:flex;align-items:center;gap:8px;}
  .cat-count{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .chev{font-size:11px;color:var(--faint);transition:transform .2s;}
  .card.open .chev{transform:rotate(90deg);}
  .drag-handle{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    color:var(--faint);cursor:grab;touch-action:none;user-select:none;flex:0 0 auto;}
  .dragging{opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.18);z-index:50;}
  .dragging .drag-handle{color:var(--text);cursor:grabbing;}
  .drop-placeholder{border:1.5px dashed #d5d5d8;border-radius:14px;margin-bottom:10px;background:#f7f7f8;}

  .cat-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .card.open .cat-body{max-height:1200px;}
  .cat-inner{padding:0 16px 14px;}

  .item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);}
  .item-row:first-child{border-top:none;}
  .check{width:20px;height:20px;border-radius:6px;border:1.6px solid #d5d5d8;flex:0 0 20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;}
  .check.done{background:var(--accent);border-color:var(--accent);}
  .check svg{width:12px;height:12px;display:none;}
  .check.done svg{display:block;}
  .item-name{flex:1;font-size:14.5px;color:var(--sub);}
  .item-name.done{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint);}
  .del{color:var(--faint);font-size:15px;cursor:pointer;padding:2px 4px;flex:0 0 auto;}

  .counter-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .counter-row:first-child{border-top:none;}
  .counter-name{flex:1;font-size:14.5px;color:var(--sub);}
  .counter-name.done{color:var(--accent-dark);font-weight:600;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stbtn{width:24px;height:24px;border-radius:50%;border:1px solid #d5d5d8;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);cursor:pointer;}
  .stbtn:active{background:#f0f0f0;}
  .stval{min-width:44px;text-align:center;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .bar{width:60px;height:5px;border-radius:3px;background:#ececec;overflow:hidden;margin-left:2px;}
  .bar-fill{height:100%;background:var(--accent);}

  .add-row{display:flex;gap:8px;padding:10px 0 2px;border-top:1px solid var(--line);margin-top:2px;}
  .add-input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;
    background:#fff;color:var(--text);outline:none;}
  .add-input:focus{border-color:#c9c9cc;}
  .add-btn{width:34px;height:34px;border-radius:8px;border:none;background:#111;color:#fff;font-size:16px;cursor:pointer;}

  /* year view */
  .yr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:14px 16px;}
  .yr-title{font-size:15.5px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .yr-title-right{display:flex;align-items:center;gap:4px;}
  .yr-sub{font-size:11.5px;color:var(--faint);font-weight:400;}
  .yr-col-label{font-size:11px;color:var(--sub);margin:8px 0 4px;text-transform:none;}
  .yr-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:12.5px;padding:4px 9px;border-radius:20px;background:#f2f2f4;color:var(--sub);}
  .tag.done{background:#f4ffd6;color:var(--accent-dark);}
  .tag.empty{color:var(--faint);font-size:12.5px;background:none;padding:0;}
  .run-note{font-size:12.5px;color:var(--sub);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .run-note b{color:var(--text);}

  .empty-state{text-align:center;color:var(--faint);font-size:13px;padding:40px 0;}

  .goal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .goal-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .goal-title{font-size:15.5px;font-weight:600;}
  .goal-input{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:14px;color:var(--text);background:var(--accent);font-family:inherit;resize:vertical;outline:none;}
  .goal-input:focus{border-color:var(--accent-dark);}
  .goal-saved{font-size:11px;color:var(--faint);margin-top:6px;height:14px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="title">Professsor Wong</div>
    <div class="tabs">
      <div class="tab active" data-view="month">月程</div>
      <div class="tab" data-view="year">年程</div>
    </div>
    <div class="nav">
      <button class="navbtn" id="prevBtn">‹</button>
      <div class="navlabel" id="navLabel">—</div>
      <button class="navbtn" id="nextBtn">›</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
const CATEGORIES = [
  {id:'work', name:'工作'},
  {id:'sh', name:'SH 研究'},
  {id:'sport', name:'運動', recurringCount:{key:'晨跑', target:16}},
  {id:'finance', name:'理財管理', recurringCheck:{key:'記帳'}},
  {id:'social', name:'娛樂'},
  {id:'shopping', name:'購買清單', defaultItems:['無印良品內褲','髮箍','水壺','枕頭套','鍋子','運動鞋']},
  {id:'japanese', name:'日語'},
  {id:'books', name:'書籍'},
  {id:'todo', name:'代辦事項'},
  {id:'other', name:'其他'},
];

let data = {items:[], recurringChecks:{}, recurringCounts:{}, yearGoals:{}, categoryOrder:[]};
let view = 'month';
let curMonth = monthKeyFromDate(new Date());
let openState = {};

function pad(n){return n<10?'0'+n:''+n;}
function monthKeyFromDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function shiftMonthKey(key,delta){
  let [y,m]=key.split('-').map(Number);
  m+=delta;
  y+=Math.floor((m-1)/12);
  m=((m-1)%12+12)%12+1;
  return y+'-'+pad(m);
}
function shiftYearKey(key,delta){
  let [y,m]=key.split('-');
  y=parseInt(y)+delta;
  return y+'-'+m;
}
function monthLabel(key){
  let [y,m]=key.split('-');
  return y+'年'+parseInt(m)+'月';
}
function yearOf(key){return key.split('-')[0];}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

const LOCAL_KEY = 'life-tracker-app-data';
const hasCloudStorage = typeof window.storage !== 'undefined';

async function load(){
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('app-data', false);
      if(res && res.value){ data = JSON.parse(res.value); }
    }else{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(raw){ data = JSON.parse(raw); }
    }
  }catch(e){ /* no data yet */ }
  ensureDefaults();
  render();
}
function ensureDefaults(){
  if(!data.yearGoals) data.yearGoals = {};
  if(!data.categoryOrder) data.categoryOrder = [];
  CATEGORIES.forEach(c=>{ if(!data.categoryOrder.includes(c.id)) data.categoryOrder.push(c.id); });
  if(!data.categoryOrder.includes('yeargoal')) data.categoryOrder.unshift('yeargoal');
  data.categoryOrder = data.categoryOrder.filter(id=>id==='yeargoal' || CATEGORIES.some(c=>c.id===id));
  const shop = CATEGORIES.find(c=>c.id==='shopping');
  const hasShop = data.items.some(it=>it.category==='shopping');
  if(!hasShop){
    const nowKey = monthKeyFromDate(new Date());
    shop.defaultItems.forEach(name=>{
      data.items.push({id:uid(), category:'shopping', name, createdMonth:nowKey, completedMonth:null});
    });
  }
}
async function save(){
  try{
    if(hasCloudStorage){
      await window.storage.set('app-data', JSON.stringify(data), false);
    }else{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
    }
  }catch(e){}
}

function orderedCategories(){
  return data.categoryOrder.map(id=>CATEGORIES.find(c=>c.id===id)).filter(Boolean);
}
function yearBlocksOrder(){
  return data.categoryOrder.map(id=>{
    if(id==='yeargoal') return {type:'goal', id:'yeargoal'};
    const cat = CATEGORIES.find(c=>c.id===id);
    return cat ? {type:'category', id:cat.id, cat} : null;
  }).filter(Boolean);
}
function moveCategory(id, delta){
  const idx = data.categoryOrder.indexOf(id);
  const newIdx = idx + delta;
  if(idx<0 || newIdx<0 || newIdx>=data.categoryOrder.length) return;
  const arr = data.categoryOrder;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  save(); render();
}

function itemsForCategoryMonth(catId, mKey){
  return data.items.filter(it=>it.category===catId && it.createdMonth<=mKey &&
    (it.completedMonth===null || mKey<=it.completedMonth));
}
function addItem(catId, name){
  if(!name.trim()) return;
  data.items.push({id:uid(), category:catId, name:name.trim(), createdMonth:curMonth, completedMonth:null});
  save(); render();
}
function toggleItem(id){
  const it = data.items.find(i=>i.id===id);
  if(!it) return;
  it.completedMonth = (it.completedMonth===curMonth) ? null : curMonth;
  save(); render();
}
function deleteItem(id){
  data.items = data.items.filter(i=>i.id!==id);
  save(); render();
}
function getCheck(key, mKey){
  return !!(data.recurringChecks[key] && data.recurringChecks[key][mKey]);
}
function toggleCheck(key, mKey){
  if(!data.recurringChecks[key]) data.recurringChecks[key]={};
  data.recurringChecks[key][mKey] = !data.recurringChecks[key][mKey];
  save(); render();
}
function getCount(key, mKey){
  return (data.recurringCounts[key] && data.recurringCounts[key][mKey]) || 0;
}
function bumpCount(key, mKey, delta){
  if(!data.recurringCounts[key]) data.recurringCounts[key]={};
  let v = (data.recurringCounts[key][mKey]||0) + delta;
  if(v<0) v=0;
  data.recurringCounts[key][mKey]=v;
  save(); render();
}
function annualCount(key, year){
  let sum=0;
  for(let m=1;m<=12;m++){
    const mk = year+'-'+pad(m);
    sum += (data.recurringCounts[key] && data.recurringCounts[key][mk]) || 0;
  }
  return sum;
}

function checkIcon(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function catTotals(cat, mKey){
  const items = itemsForCategoryMonth(cat.id, mKey);
  let total = items.length, done = items.filter(i=>i.completedMonth===mKey).length;
  if(cat.recurringCount){ total+=1; if(getCount(cat.recurringCount.key+':'+cat.id, mKey)>=cat.recurringCount.target) done+=1; }
  if(cat.recurringCheck){ total+=1; if(getCheck(cat.recurringCheck.key+':'+cat.id, mKey)) done+=1; }
  return {total, done};
}

function renderMonthView(){
  let html = '';
  const cats = orderedCategories();
  cats.forEach((cat)=>{
    const isOpen = openState[cat.id] !== false; // default open
    const items = itemsForCategoryMonth(cat.id, curMonth);
    const {total, done} = catTotals(cat, curMonth);
    html += `<div class="card ${isOpen?'open':''}" data-cat="${cat.id}">
      <div class="cat-head" data-toggle="${cat.id}">
        <div class="cat-name">${cat.name}</div>
        <div class="cat-right">
          <span class="cat-count">${done}/${total}</span>
          <div class="drag-handle" data-drag="${cat.id}"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div>
          <span class="chev">▶</span>
        </div>
      </div>
      <div class="cat-body"><div class="cat-inner">`;

    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      const c = getCount(key, curMonth), t = cat.recurringCount.target;
      const pct = Math.min(100, Math.round(c/t*100));
      html += `<div class="counter-row">
        <div class="counter-name ${c>=t?'done':''}">${cat.recurringCount.key}</div>
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="stepper">
          <button class="stbtn" data-bump="${key}|-1">−</button>
          <div class="stval">${c}/${t}</div>
          <button class="stbtn" data-bump="${key}|1">+</button>
        </div>
      </div>`;
    }
    if(cat.recurringCheck){
      const key = cat.recurringCheck.key+':'+cat.id;
      const on = getCheck(key, curMonth);
      html += `<div class="item-row">
        <div class="check ${on?'done':''}" data-checkrec="${key}">${checkIcon()}</div>
        <div class="item-name ${on?'done':''}">${cat.recurringCheck.key}（每月）</div>
      </div>`;
    }
    if(items.length===0 && !cat.recurringCount && !cat.recurringCheck){
      html += `<div class="empty-state" style="padding:16px 0 4px;">尚無項目</div>`;
    }
    items.forEach(it=>{
      const on = it.completedMonth===curMonth;
      html += `<div class="item-row">
        <div class="check ${on?'done':''}" data-check="${it.id}">${checkIcon()}</div>
        <div class="item-name ${on?'done':''}">${escapeHtml(it.name)}</div>
        <div class="del" data-del="${it.id}">×</div>
      </div>`;
    });

    html += `<div class="add-row">
      <input class="add-input" placeholder="新增項目…" data-input="${cat.id}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="add-btn" data-add="${cat.id}">＋</button>
    </div>`;
    html += `</div></div></div>`;
  });
  return html;
}

function monthsCheckedInYear(key, year){
  let n=0;
  for(let m=1;m<=12;m++){ if(getCheck(key, year+'-'+pad(m))) n++; }
  return n;
}

function renderYearView(){
  const year = yearOf(curMonth);
  let html = '';
  yearBlocksOrder().forEach(block=>{
    if(block.type==='goal'){
      const goalText = data.yearGoals[year] || '';
      html += `<div class="goal-card" data-cat="yeargoal">
        <div class="goal-title-row"><span class="goal-title">${year} 年度目標</span><div class="drag-handle" data-drag="yeargoal"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div></div>
        <textarea class="goal-input" id="goalInput" placeholder="寫下這一年想達成的目標…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${escapeHtml(goalText)}</textarea>
        <div class="goal-saved" id="goalSaved"></div>
      </div>`;
      return;
    }

    const cat = block.cat;
    // items completed sometime within this year
    const doneItems = data.items.filter(it=>it.category===cat.id && it.completedMonth && it.completedMonth.slice(0,4)===year);
    // items still open right now (regardless of year), that already existed by this year
    const undoneItems = data.items.filter(it=>it.category===cat.id && it.completedMonth===null && it.createdMonth.slice(0,4)<=year);

    let total = doneItems.length + undoneItems.length;
    let done = doneItems.length;
    if(cat.recurringCount) total += 1;
    if(cat.recurringCheck) total += 1;
    let recurringDoneBonus = 0;
    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      if(annualCount(key, year) >= 12*cat.recurringCount.target) recurringDoneBonus++;
    }
    if(cat.recurringCheck){
      const key = cat.recurringCheck.key+':'+cat.id;
      if(monthsCheckedInYear(key, year)===12) recurringDoneBonus++;
    }
    done += recurringDoneBonus;

    html += `<div class="yr-card" data-cat="${cat.id}">
      <div class="yr-title"><span>${cat.name}</span><div class="yr-title-right"><span class="yr-sub">${done}/${total}（年度）</span><div class="drag-handle" data-drag="${cat.id}"><svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="14" cy="4" r="1.6"/><circle cx="6" cy="10" r="1.6"/><circle cx="14" cy="10" r="1.6"/><circle cx="6" cy="16" r="1.6"/><circle cx="14" cy="16" r="1.6"/></svg></div></div></div>

      <div class="yr-col-label">已完成項目</div>
      <div class="yr-tags">`;
    if(doneItems.length===0) html += `<span class="tag empty">—</span>`;
    doneItems.forEach(it=>{
      html += `<span class="tag done">✓ ${escapeHtml(it.name)}</span>`;
    });
    html += `</div>

      <div class="yr-col-label">尚未完成項目</div>
      <div class="yr-tags">`;
    if(undoneItems.length===0) html += `<span class="tag empty">—</span>`;
    undoneItems.forEach(it=>{
      html += `<span class="tag">${escapeHtml(it.name)}</span>`;
    });
    html += `</div>`;

    if(cat.recurringCount){
      const key = cat.recurringCount.key+':'+cat.id;
      const ac = annualCount(key, year);
      html += `<div class="run-note">${cat.recurringCount.key}年度累計：<b>${ac} / ${12*cat.recurringCount.target}</b></div>`;
    }
    if(cat.recurringCheck){
      const key = cat.recurringCheck.key+':'+cat.id;
      const mc = monthsCheckedInYear(key, year);
      html += `<div class="run-note">${cat.recurringCheck.key}完成月數：<b>${mc} / 12</b></div>`;
    }
    html += `</div>`;
  });

  return html;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  document.getElementById('navLabel').textContent = view==='month' ? monthLabel(curMonth) : (yearOf(curMonth)+'年');
  const main = document.getElementById('main');
  main.innerHTML = view==='month' ? renderMonthView() : renderYearView();
  bindEvents();
}

function initDragHandle(handle){
  const LONG_PRESS_MS = 320;
  const MOVE_CANCEL_PX = 8;
  let pressTimer = null;
  let startX=0, startY=0;
  let dragging = false;
  let card = null, placeholder = null, container = null;
  let cardTop=0, cardLeft=0, cardWidth=0, cardHeight=0;

  function cleanup(){
    dragging = false;
    if(card){
      card.classList.remove('dragging');
      card.style.position='';
      card.style.top='';
      card.style.left='';
      card.style.width='';
      card.style.margin='';
    }
    if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    card = null; placeholder = null; container = null;
  }

  function onMove(e){
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    if(!dragging){
      if(Math.abs(y-startY) > MOVE_CANCEL_PX || Math.abs(x-startX) > MOVE_CANCEL_PX){
        clearTimeout(pressTimer);
      }
      return;
    }
    e.preventDefault();
    const dy = y - startY;
    card.style.top = (cardTop + dy) + 'px';

    const centerY = cardTop + dy + cardHeight/2;
    const siblings = Array.from(container.querySelectorAll('[data-cat]')).filter(c=>c!==card);
    for(const sib of siblings){
      const r = sib.getBoundingClientRect();
      const sibCenter = r.top + r.height/2;
      if(centerY < sibCenter && sib.compareDocumentPosition(placeholder) & Node.DOCUMENT_POSITION_FOLLOWING){
        container.insertBefore(placeholder, sib);
        break;
      }
      if(centerY > sibCenter && sib.compareDocumentPosition(placeholder) & Node.DOCUMENT_POSITION_PRECEDING){
        container.insertBefore(placeholder, sib.nextSibling);
        break;
      }
    }
  }

  function onUp(){
    clearTimeout(pressTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if(!dragging){ cleanup(); return; }

    container.insertBefore(card, placeholder);
    const newOrder = Array.from(container.querySelectorAll('[data-cat]')).map(c=>c.getAttribute('data-cat'));
    cleanup();
    data.categoryOrder = newOrder;
    save(); render();
  }

  handle.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    startX = e.clientX; startY = e.clientY;
    card = handle.closest('[data-cat]');
    container = card.parentElement;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{
      dragging = true;
      const r = card.getBoundingClientRect();
      cardTop = r.top; cardLeft = r.left; cardWidth = r.width; cardHeight = r.height;
      placeholder = document.createElement('div');
      placeholder.className = 'drop-placeholder';
      placeholder.style.height = cardHeight + 'px';
      container.insertBefore(placeholder, card);
      card.classList.add('dragging');
      card.style.position='fixed';
      card.style.top = cardTop+'px';
      card.style.left = cardLeft+'px';
      card.style.width = cardWidth+'px';
      card.style.margin = '0';
      if(navigator.vibrate) navigator.vibrate(8);
    }, LONG_PRESS_MS);
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

function bindEvents(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-toggle');
      openState[id] = !(openState[id] !== false);
      render();
    };
  });
  document.querySelectorAll('[data-drag]').forEach(el=>{
    initDragHandle(el);
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggleItem(el.getAttribute('data-check')); };
  });
  document.querySelectorAll('[data-checkrec]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); toggleCheck(el.getAttribute('data-checkrec'), curMonth); };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteItem(el.getAttribute('data-del')); };
  });
  document.querySelectorAll('[data-bump]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const [key, d] = el.getAttribute('data-bump').split('|');
      bumpCount(key, curMonth, parseInt(d));
    };
  });
  document.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const catId = el.getAttribute('data-add');
      const input = document.querySelector(`[data-input="${catId}"]`);
      addItem(catId, input.value);
      input.value='';
    };
  });
  document.querySelectorAll('[data-input]').forEach(el=>{
    el.onclick = (e)=>e.stopPropagation();
    el.onkeydown = (e)=>{
      if(e.key==='Enter'){
        const catId = el.getAttribute('data-input');
        addItem(catId, el.value);
        el.value='';
      }
    };
  });

  const goalInput = document.getElementById('goalInput');
  if(goalInput){
    let t;
    goalInput.oninput = ()=>{
      const year = yearOf(curMonth);
      data.yearGoals[year] = goalInput.value;
      clearTimeout(t);
      const saved = document.getElementById('goalSaved');
      t = setTimeout(async ()=>{
        await save();
        if(saved) saved.textContent = '已儲存';
        setTimeout(()=>{ if(saved) saved.textContent=''; }, 1500);
      }, 500);
    };
  }
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    view = t.getAttribute('data-view');
    render();
  };
});
document.getElementById('prevBtn').onclick = ()=>{
  curMonth = view==='month' ? shiftMonthKey(curMonth,-1) : shiftYearKey(curMonth,-1);
  render();
};
document.getElementById('nextBtn').onclick = ()=>{
  curMonth = view==='month' ? shiftMonthKey(curMonth,1) : shiftYearKey(curMonth,1);
  render();
};

load();
</script>
</body>
</html>
